<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Snake klasik edisi Kimi K3 — cosmic purple theme.">
  <title>Kimi K3 — Cosmic Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="logo">✦</span>
        <h1>KIMI<span class="lite">K3</span></h1>
      </div>
      <div class="scores">
        <div class="box">
          <span class="lbl">Skor</span>
          <strong id="score">0</strong>
        </div>
        <div class="box hi">
          <span class="lbl">Rekor</span>
          <strong id="highScore">0</strong>
        </div>
      </div>
    </header>

    <div class="arena" id="arena">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div class="over" id="startOverlay">
        <div class="modal">
          <span class="emoji-lg">🌌</span>
          <h2>Siap Bertualang?</h2>
          <p id="ctrlHint">Gunakan tombol panah untuk bergerak</p>
          <button class="btn" id="startBtn">MAIN</button>
        </div>
      </div>

      <div class="over hidden" id="gameOverOverlay">
        <div class="modal">
          <span class="emoji-lg">💫</span>
          <h2 class="dead">Game Over</h2>
          <div class="finals">
            <div><span class="lbl">Skor</span><strong id="finalScore">0</strong></div>
            <div><span class="lbl">Rekor</span><strong id="finalHighScore">0</strong></div>
          </div>
          <p class="new-rec hidden" id="newRec">✨ Rekor Baru!</p>
          <button class="btn" id="restartBtn">LAGI</button>
        </div>
      </div>
    </div>

    <p class="tip" id="footerTip">↑ ↓ ← →  —  Spasi untuk pause</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
