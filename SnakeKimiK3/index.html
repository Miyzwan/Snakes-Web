<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Game Snake klasik yang bisa dimainkan langsung di browser — desktop dan mobile.">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <header class="scoreboard">
      <div class="score-box">
        <span class="score-label">Skor</span>
        <span class="score-value" id="score">0</span>
      </div>
      <h1 class="game-title">SNAKE</h1>
      <div class="score-box">
        <span class="score-label">Tertinggi</span>
        <span class="score-value" id="highScore">0</span>
      </div>
    </header>

    <div class="arena-wrapper" id="arenaWrapper">
      <canvas id="gameCanvas" width="400" height="400" aria-label="Arena permainan Snake"></canvas>

      <div class="overlay" id="startOverlay">
        <div class="overlay-content">
          <h2 class="overlay-title">SNAKE</h2>
          <p class="overlay-text" id="controlInstruction">Gunakan tombol panah (↑ ↓ ← →) untuk bergerak.</p>
          <button class="btn" id="startBtn" type="button">Mulai Main</button>
        </div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-content">
          <h2 class="overlay-title game-over-title">Game Over</h2>
          <p class="overlay-text">Skor Akhir: <strong id="finalScore">0</strong></p>
          <p class="overlay-text">Skor Tertinggi: <strong id="finalHighScore">0</strong></p>
          <p class="overlay-text new-record hidden" id="newRecord">Rekor Baru!</p>
          <button class="btn" id="restartBtn" type="button">Main Lagi</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="footerHint">Tekan tombol panah untuk bergerak</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
